[package]
name = "apidiff"
version = "0.1.0"
edition = "2021"
description = "Diffs two OpenAPI specs and reports breaking changes — for a CI gate on your API contract"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/apidiff"
readme = "README.md"
keywords = ["openapi", "api", "breaking-changes", "ci", "swagger"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "apidiff"
path = "src/lib.rs"

[[bin]]
name = "apidiff"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
